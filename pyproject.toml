[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pywerfl"
version = "0.1.0"
description = "Tools for working with data from the TTU Wind Engineering Research Field Laboratory (WERFL)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "pyarrow",
    "openpyxl",
    "matplotlib",
    "scipy",
]

[project.scripts]
pywerfl-designsafe = "pywerfl.sources.designsafe:main"
pywerfl-onerunsimple = "pywerfl.sources.onerunsimple:main"

[tool.setuptools.packages.find]
include = ["pywerfl*"]

[tool.setuptools.package-data]
pywerfl = ["reference_data/*.csv"]
